openapi: 3.1.0

info:
  title: Letrados API
  version: 2.0.0
  description: |
    API de Letrados. Ciclo 1: autenticacion (modulo 1). Ciclo 2: usuarios y
    roles (modulo 2) y catalogo de libros (modulo 3).

    Las sesiones son revocables: cada token lleva un `jti` registrado en el
    servidor, y cerrar sesion, bloquear una cuenta o darla de baja lo invalida
    al instante. El rol se lee de la base en cada peticion, no del token.

    Todas las respuestas son JSON. Los errores tienen siempre la misma forma:

    ```json
    { "error": { "codigo": "DATOS_INVALIDOS", "mensaje": "...", "detalles": [] } }
    ```

    El usuario de la sesion expone solo `id`, `nombre`, `email` y `rol`; nunca
    el hash de la contrasena (RNF-08). El correo solo sale para su dueño y para
    el administrador; el perfil publico nunca lo muestra (RF-08).

    Un recurso privado ajeno responde 404 `NO_ENCONTRADO`, no 403: un 403
    confirmaria que el id existe.

    Cualquier ruta bajo `/api` que no exista responde 404 `RUTA_NO_ENCONTRADA`
    con esa misma forma de error: el router de la API termina en un manejador
    propio, asi que nunca devuelve el HTML de la aplicacion.

servers:
  - url: /api
    description: Mismo origen que el frontend

tags:
  - name: Autenticacion
    description: Registro, sesion y recuperacion de contrasena
  - name: Perfil
    description: Perfil propio, perfil publico y baja de cuenta (RF-05, RF-08, RF-09)
  - name: Catalogo
    description: Libros del catalogo propio (RF-10 a RF-13)
  - name: Administracion
    description: Cuentas y bloqueo (RF-06, RF-07). Requiere rol administrador.

paths:
  /auth/registro:
    post:
      tags: [Autenticacion]
      operationId: registrar
      security: []
      summary: Crear una cuenta
      description: |
        Registra un usuario nuevo y devuelve su sesion ya iniciada.
        El correo se compara sin distinguir mayusculas de minusculas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoRegistro'
      responses:
        '201':
          description: Cuenta creada. Devuelve el token de sesion y el usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
        '400':
          $ref: '#/components/responses/EntradaInvalida'
        '409':
          description: Ya existe una cuenta con ese correo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: EMAIL_DUPLICADO
                  mensaje: Ya existe una cuenta con ese correo
                  detalles: []
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /auth/login:
    post:
      tags: [Autenticacion]
      operationId: iniciarSesion
      security: []
      summary: Iniciar sesion
      description: |
        Valida las credenciales y devuelve una sesion. Ante cualquier fallo
        responde el mismo error, sin distinguir si fallo el correo o la
        contrasena.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoLogin'
      responses:
        '200':
          description: Credenciales correctas. Devuelve el token de sesion y el usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
        '400':
          $ref: '#/components/responses/EntradaInvalida'
        '401':
          description: Correo o contrasena incorrectos. El mensaje es siempre el mismo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: CREDENCIALES_INVALIDAS
                  mensaje: El correo o la contrasena no son correctos
                  detalles: []
        '403':
          $ref: '#/components/responses/CuentaBloqueada'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /auth/yo:
    get:
      tags: [Autenticacion]
      operationId: usuarioActual
      summary: Datos del usuario de la sesion actual
      description: |
        Devuelve los datos del usuario dueño de la sesion, con su rol.
      security:
        - sesion: []
      responses:
        '200':
          description: Sesion valida.
          content:
            application/json:
              schema:
                type: object
                required: [usuario]
                properties:
                  usuario:
                    $ref: '#/components/schemas/UsuarioPublico'
        '401':
          description: |
            Falta la cabecera, el esquema no es Bearer, la firma no es valida,
            el token vencio o la sesion fue revocada. No se dice cual fue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: SESION_INVALIDA
                  mensaje: La sesion no es valida o expiro. Inicia sesion de nuevo.
                  detalles: []
        '403':
          $ref: '#/components/responses/CuentaBloqueada'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /auth/logout:
    post:
      tags: [Autenticacion]
      operationId: cerrarSesion
      summary: Cerrar la sesion actual (RF-03)
      description: |
        Revoca en el servidor la sesion del token usado: la peticion siguiente
        con ese token da 401. Las otras sesiones del mismo usuario siguen vivas.
      security:
        - sesion: []
      responses:
        '200':
          description: Sesion cerrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '401':
          $ref: '#/components/responses/SinSesion'

  /auth/recuperacion:
    post:
      tags: [Autenticacion]
      operationId: pedirRecuperacion
      security: []
      summary: Pedir un enlace de recuperacion de contrasena
      description: |
        Si el correo pertenece a una cuenta, envia un enlace de recuperacion.
        La respuesta es siempre la misma, exista o no la cuenta, para no revelar
        que correos estan registrados.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoRecuperacion'
      responses:
        '200':
          description: Pedido recibido. Mismo cuerpo exista o no la cuenta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
              example:
                mensaje: Si el correo esta registrado, te enviamos un enlace para recuperar la contrasena.
        '400':
          $ref: '#/components/responses/EntradaInvalida'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /auth/recuperacion/confirmar:
    post:
      tags: [Autenticacion]
      operationId: confirmarRecuperacion
      security: []
      summary: Poner una contrasena nueva con el token del enlace
      description: |
        Valida el token de un solo uso que llego por correo y cambia la
        contrasena.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoConfirmacion'
      responses:
        '200':
          description: Contrasena actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
              example:
                mensaje: Tu contrasena fue actualizada. Ya podes iniciar sesion.
        '400':
          description: |
            Entrada invalida (`DATOS_INVALIDOS`, `JSON_INVALIDO`) o token malo,
            vencido o ya usado (`TOKEN_INVALIDO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tokenInvalido:
                  summary: Token malo, vencido o ya usado
                  value:
                    error:
                      codigo: TOKEN_INVALIDO
                      mensaje: El enlace no es valido o ya vencio
                      detalles: []
                datosInvalidos:
                  summary: Faltan campos o no cumplen las reglas
                  value:
                    error:
                      codigo: DATOS_INVALIDOS
                      mensaje: Los datos enviados no son validos
                      detalles:
                        - campo: token
                          mensaje: El token es obligatorio
                        - campo: contrasena
                          mensaje: La contrasena debe tener al menos 8 caracteres
                jsonInvalido:
                  $ref: '#/components/examples/JsonInvalido'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /perfil:
    get:
      tags: [Perfil]
      operationId: verPerfil
      summary: Perfil propio (RF-05)
      security:
        - sesion: []
      responses:
        '200':
          description: Perfil, con el correo (solo para su dueño).
          content:
            application/json:
              schema:
                type: object
                required: [perfil]
                properties:
                  perfil:
                    $ref: '#/components/schemas/Perfil'
        '401':
          $ref: '#/components/responses/SinSesion'
    put:
      tags: [Perfil]
      operationId: modificarNombre
      summary: Modificar el nombre (RF-05)
      description: Solo el nombre; el correo no se puede cambiar. Obligatorio, hasta 80 caracteres.
      security:
        - sesion: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre]
              properties:
                nombre:
                  type: string
                  minLength: 1
                  maxLength: 80
      responses:
        '200':
          description: Perfil actualizado.
          content:
            application/json:
              schema:
                type: object
                required: [perfil]
                properties:
                  perfil:
                    $ref: '#/components/schemas/Perfil'
        '400':
          $ref: '#/components/responses/EntradaInvalida'
        '401':
          $ref: '#/components/responses/SinSesion'
    delete:
      tags: [Perfil]
      operationId: darDeBaja
      summary: Dar de baja la cuenta (RF-09)
      description: |
        Pide la contraseña. En una sola transaccion archiva los libros,
        anonimiza la cuenta (nombre «Cuenta eliminada», correo
        `eliminada+<id>@letrados.invalid`) y revoca todas sus sesiones.
      security:
        - sesion: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contrasena]
              properties:
                contrasena:
                  type: string
                  format: password
      responses:
        '200':
          description: Cuenta dada de baja.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          $ref: '#/components/responses/EntradaInvalida'
        '401':
          $ref: '#/components/responses/ContrasenaIncorrecta'

  /perfil/contrasena:
    put:
      tags: [Perfil]
      operationId: cambiarContrasena
      summary: Cambiar la contraseña (RF-05)
      description: |
        Verifica la contraseña actual, cambia el hash y revoca las demas
        sesiones del usuario, no la que hizo el cambio.
      security:
        - sesion: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contrasenaActual, contrasenaNueva]
              properties:
                contrasenaActual:
                  type: string
                  format: password
                contrasenaNueva:
                  type: string
                  format: password
                  minLength: 8
                  description: Al menos una letra y un numero.
      responses:
        '200':
          description: Contraseña cambiada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          $ref: '#/components/responses/EntradaInvalida'
        '401':
          $ref: '#/components/responses/ContrasenaIncorrecta'

  /usuarios/{id}:
    get:
      tags: [Perfil]
      operationId: perfilPublico
      summary: Perfil publico (RF-08)
      description: |
        Publico, sin sesion. Nombre, reputacion y publicaciones activas; nunca
        el correo, el rol ni el estado. Una cuenta eliminada responde 200 con
        «Cuenta eliminada» para no romper los enlaces del historial (RF-09).
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Perfil publico.
          content:
            application/json:
              schema:
                type: object
                required: [usuario]
                properties:
                  usuario:
                    $ref: '#/components/schemas/PerfilPublico'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /libros:
    get:
      tags: [Catalogo]
      operationId: listarLibros
      summary: Consultar el catalogo propio (RF-13)
      description: |
        Sin archivados, del mas nuevo al mas viejo. `q` busca por subcadena en
        titulo o autor sin distinguir mayusculas.
      security:
        - sesion: []
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Pagina del catalogo.
          content:
            application/json:
              schema:
                type: object
                required: [datos, paginacion]
                properties:
                  datos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Libro'
                  paginacion:
                    $ref: '#/components/schemas/Paginacion'
        '401':
          $ref: '#/components/responses/SinSesion'
    post:
      tags: [Catalogo]
      operationId: agregarLibro
      summary: Agregar un libro (RF-10)
      security:
        - sesion: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoLibro'
      responses:
        '201':
          description: Libro creado.
          content:
            application/json:
              schema:
                type: object
                required: [libro]
                properties:
                  libro:
                    $ref: '#/components/schemas/Libro'
        '400':
          $ref: '#/components/responses/EntradaInvalida'
        '401':
          $ref: '#/components/responses/SinSesion'

  /libros/{id}:
    put:
      tags: [Catalogo]
      operationId: modificarLibro
      summary: Modificar un libro propio (RF-11)
      description: |
        Reemplazo de los tres campos. La cantidad no puede quedar por debajo de
        los ejemplares reservados: 409 con el minimo en el mensaje.
      security:
        - sesion: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoLibro'
      responses:
        '200':
          description: Libro modificado.
          content:
            application/json:
              schema:
                type: object
                required: [libro]
                properties:
                  libro:
                    $ref: '#/components/schemas/Libro'
        '400':
          $ref: '#/components/responses/EntradaInvalida'
        '401':
          $ref: '#/components/responses/SinSesion'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/EstadoInvalido'
    delete:
      tags: [Catalogo]
      operationId: retirarLibro
      summary: Retirar un libro propio (RF-12)
      description: |
        Con publicaciones o solicitudes activas -> 409. Con intercambios
        completados se archiva; si no, se elimina. La respuesta dice cual.
      security:
        - sesion: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Libro retirado.
          content:
            application/json:
              schema:
                type: object
                required: [resultado]
                properties:
                  resultado:
                    type: string
                    enum: [archivado, eliminado]
        '401':
          $ref: '#/components/responses/SinSesion'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/EstadoInvalido'

  /admin/cuentas:
    get:
      tags: [Administracion]
      operationId: listarCuentas
      summary: Listar cuentas (RF-07)
      description: Busqueda por nombre o correo, filtro por estado y sesiones activas por cuenta.
      security:
        - sesion: []
      parameters:
        - $ref: '#/components/parameters/Q'
        - name: estado
          in: query
          description: Un valor desconocido se ignora.
          schema:
            type: string
            enum: [activa, bloqueada, eliminada]
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Pagina de cuentas.
          content:
            application/json:
              schema:
                type: object
                required: [datos, paginacion]
                properties:
                  datos:
                    type: array
                    items:
                      $ref: '#/components/schemas/CuentaAdmin'
                  paginacion:
                    $ref: '#/components/schemas/Paginacion'
        '401':
          $ref: '#/components/responses/SinSesion'
        '403':
          $ref: '#/components/responses/AccesoDenegado'

  /admin/cuentas/{id}/bloqueo:
    post:
      tags: [Administracion]
      operationId: bloquearCuenta
      summary: Bloquear una cuenta (RF-07)
      description: Pasa la cuenta a `bloqueada` y revoca todas sus sesiones, en una transaccion.
      security:
        - sesion: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/CuentaActualizada'
        '401':
          $ref: '#/components/responses/SinSesion'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/EstadoInvalido'
    delete:
      tags: [Administracion]
      operationId: desbloquearCuenta
      summary: Desbloquear una cuenta (RF-07)
      description: Vuelve a `activa`. No resucita sesiones; la persona entra de nuevo con su contraseña.
      security:
        - sesion: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/CuentaActualizada'
        '401':
          $ref: '#/components/responses/SinSesion'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/EstadoInvalido'

components:
  securitySchemes:
    sesion:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token que devuelven registro e inicio de sesion (claims `sub`, `rol`
        y `jti`), en la cabecera
        `Authorization: Bearer <token>`. JWT HS256 con el id del usuario en `sub`.

  schemas:
    UsuarioPublico:
      type: object
      description: Datos del usuario de la sesion (RNF-08).
      required: [id, nombre, email, rol]
      properties:
        id:
          type: string
          description: Identificador numerico del usuario, serializado como texto.
          example: '1'
        nombre:
          type: string
          maxLength: 80
          example: Ana Gomez
        email:
          type: string
          format: email
          maxLength: 254
          example: ana@example.com
        rol:
          $ref: '#/components/schemas/Rol'
      additionalProperties: false

    Rol:
      type: string
      enum: [usuario, administrador]
      description: Toda cuenta nueva nace `usuario` (RF-06).

    Ok:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true

    Reputacion:
      type: object
      required: [promedio, cantidad]
      properties:
        promedio:
          type: [number, 'null']
          description: null mientras no haya valoraciones («Sin valoraciones»).
        cantidad:
          type: integer

    Perfil:
      type: object
      required: [id, nombre, email, rol, creadoEn, reputacion]
      properties:
        id: {type: string}
        nombre: {type: string}
        email: {type: string, format: email}
        rol: {$ref: '#/components/schemas/Rol'}
        creadoEn: {type: string, format: date-time}
        reputacion: {$ref: '#/components/schemas/Reputacion'}

    PerfilPublico:
      type: object
      required: [id, nombre, eliminada, reputacion, publicaciones]
      properties:
        id: {type: string}
        nombre: {type: string, example: Ana Gomez}
        eliminada: {type: boolean}
        reputacion: {$ref: '#/components/schemas/Reputacion'}
        publicaciones:
          type: array
          description: Publicaciones activas (llegan con el modulo 4; hoy vacia).
          items: {type: object}
      additionalProperties: false

    Libro:
      type: object
      required: [id, titulo, autor, total, reservada, disponible, publicado, tieneHistorial, creadoEn]
      properties:
        id: {type: string, example: '3'}
        titulo: {type: string, example: Rayuela}
        autor: {type: string, example: Julio Cortazar}
        total: {type: integer, minimum: 0, example: 2}
        reservada: {type: integer, minimum: 0, example: 1}
        disponible:
          type: integer
          description: total - reservada. Se calcula, nunca se guarda.
          example: 1
        publicado: {type: boolean}
        tieneHistorial:
          type: boolean
          description: Si participo en intercambios completados (al retirarlo se archiva).
        creadoEn: {type: string, format: date-time}

    PedidoLibro:
      type: object
      required: [titulo, autor, cantidad]
      properties:
        titulo: {type: string, minLength: 1, maxLength: 200}
        autor: {type: string, minLength: 1, maxLength: 200}
        cantidad:
          type: integer
          minimum: 1
          description: Entero >= 1. Tambien se acepta como texto ("3").

    CuentaAdmin:
      type: object
      required: [id, nombre, email, rol, estado, creadoEn, sesionesActivas]
      properties:
        id: {type: string}
        nombre: {type: string}
        email: {type: string}
        rol: {$ref: '#/components/schemas/Rol'}
        estado:
          type: string
          enum: [activa, bloqueada, eliminada]
        creadoEn: {type: string, format: date-time}
        sesionesActivas: {type: integer}

    Paginacion:
      type: object
      required: [pagina, porPagina, total]
      properties:
        pagina: {type: integer, minimum: 1}
        porPagina: {type: integer, minimum: 1, maximum: 50}
        total: {type: integer, description: Total de filas que cumplen el filtro.}

    Sesion:
      type: object
      required: [token, usuario]
      properties:
        token:
          type: string
          description: JWT de sesion. Su duracion la fija `JWT_VENCIMIENTO` (por defecto 24 h).
        usuario:
          $ref: '#/components/schemas/UsuarioPublico'

    Mensaje:
      type: object
      required: [mensaje]
      properties:
        mensaje:
          type: string

    PedidoRegistro:
      type: object
      required: [nombre, email, contrasena]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 80
          description: Se recortan los espacios de los bordes antes de validar.
          example: Ana Gomez
        email:
          type: string
          format: email
          maxLength: 254
          example: ana@example.com
        contrasena:
          type: string
          format: password
          minLength: 8
          example: una-clave-larga

    PedidoLogin:
      type: object
      required: [email, contrasena]
      properties:
        email:
          type: string
          minLength: 1
          example: ana@example.com
        contrasena:
          type: string
          format: password
          minLength: 1
          example: una-clave-larga

    PedidoRecuperacion:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: ana@example.com

    PedidoConfirmacion:
      type: object
      required: [token, contrasena]
      properties:
        token:
          type: string
          minLength: 1
          description: Token de un solo uso que llega en el enlace del correo.
        contrasena:
          type: string
          format: password
          minLength: 8
          example: otra-clave-larga

    Error:
      type: object
      description: Forma unica de todos los errores de la API.
      required: [error]
      properties:
        error:
          type: object
          required: [codigo, mensaje, detalles]
          properties:
            codigo:
              type: string
              description: Identificador estable del error, en mayusculas.
              enum:
                - DATOS_INVALIDOS
                - JSON_INVALIDO
                - EMAIL_DUPLICADO
                - CREDENCIALES_INVALIDAS
                - SESION_INVALIDA
                - TOKEN_INVALIDO
                - CUENTA_BLOQUEADA
                - ACCESO_DENEGADO
                - CONTRASENA_INCORRECTA
                - NO_ENCONTRADO
                - ESTADO_INVALIDO
                - RUTA_NO_ENCONTRADA
                - NO_IMPLEMENTADO
                - ERROR_INTERNO
            mensaje:
              type: string
              description: Texto para el usuario final. Nunca lleva datos internos.
            detalles:
              type: array
              description: Errores puntuales por campo. Vacio cuando no aplica.
              items:
                $ref: '#/components/schemas/DetalleError'

    DetalleError:
      type: object
      required: [mensaje]
      properties:
        campo:
          type: string
          example: email
        mensaje:
          type: string
          example: El correo no tiene un formato valido

  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Un id que no es entero positivo responde 404.
      schema: {type: string, pattern: '^[1-9][0-9]*$'}
    Q:
      name: q
      in: query
      description: Busqueda por subcadena, sin distinguir mayusculas.
      schema: {type: string}
    Pagina:
      name: pagina
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    PorPagina:
      name: porPagina
      in: query
      description: Fuera de rango se recorta, no es error.
      schema: {type: integer, minimum: 1, maximum: 50, default: 20}

  examples:
    JsonInvalido:
      summary: El cuerpo no se pudo leer como JSON
      value:
        error:
          codigo: JSON_INVALIDO
          mensaje: El cuerpo de la peticion no es JSON valido
          detalles: []

  responses:
    EntradaInvalida:
      description: |
        La entrada no cumple las reglas (`DATOS_INVALIDOS`, con un detalle por
        cada campo que fallo) o el cuerpo no es JSON valido (`JSON_INVALIDO`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            datosInvalidos:
              summary: Uno o mas campos no cumplen las reglas
              value:
                error:
                  codigo: DATOS_INVALIDOS
                  mensaje: Los datos enviados no son validos
                  detalles:
                    - campo: nombre
                      mensaje: El nombre es obligatorio
                    - campo: email
                      mensaje: El correo no tiene un formato valido
                    - campo: contrasena
                      mensaje: La contrasena debe tener al menos 8 caracteres
            jsonInvalido:
              $ref: '#/components/examples/JsonInvalido'

    ErrorInterno:
      description: Error inesperado del servidor. Nunca expone el detalle interno.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: ERROR_INTERNO
              mensaje: Ocurrio un error inesperado. Volve a intentar en un momento.
              detalles: []

    RutaNoEncontrada:
      description: |
        La ruta pedida no existe bajo `/api`. La devuelve el terminador del
        router de la API, antes de los archivos estaticos del frontend.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: RUTA_NO_ENCONTRADA
              mensaje: No existe la ruta POST /api/auth/loquesea
              detalles: []

    SinSesion:
      description: Sin sesion valida (falta, vencida o revocada).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: SESION_INVALIDA
              mensaje: "La sesion no es valida o expiro. Inicia sesion de nuevo."
              detalles: []

    CuentaBloqueada:
      description: Cuenta bloqueada o eliminada. Solo se responde a quien ya probo la contraseña.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: CUENTA_BLOQUEADA
              mensaje: "Tu cuenta no esta habilitada. Si crees que es un error, contacta a un administrador."
              detalles: []

    AccesoDenegado:
      description: Sesion valida sin el rol requerido (administrador).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: ACCESO_DENEGADO
              mensaje: "No tenes permiso para realizar esta accion"
              detalles: []

    NoEncontrado:
      description: No existe, o es un recurso privado ajeno.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: NO_ENCONTRADO
              mensaje: "No encontramos ese libro en tu catalogo"
              detalles: []

    EstadoInvalido:
      description: La operacion no es legal en el estado actual del recurso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: ESTADO_INVALIDO
              mensaje: "Tenes 2 ejemplares reservados en intercambios aceptados. No podes bajar de 2."
              detalles: []

    ContrasenaIncorrecta:
      description: La contraseña de reautenticacion no coincide.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: CONTRASENA_INCORRECTA
              mensaje: "La contrasena no es correcta"
              detalles: []

    CuentaActualizada:
      description: Cuenta con su estado nuevo.
      content:
        application/json:
          schema:
            type: object
            required: [cuenta]
            properties:
              cuenta:
                $ref: '#/components/schemas/CuentaAdmin'
