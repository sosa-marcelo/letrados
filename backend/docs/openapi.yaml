openapi: 3.1.0

info:
  title: Letrados API
  version: 2.0.0
  description: |
    API de Letrados. Ciclo 1: autenticacion (modulo 1). Ciclo 2: usuarios y
    roles (modulo 2) y catalogo de libros (modulo 3). Ciclo 3: publicaciones y
    solicitudes e intercambios (modulo 4), y plazo, reportes y valoraciones
    (modulo 5).

    Las sesiones son revocables: cada token lleva un `jti` registrado en el
    servidor, y cerrar sesion, bloquear una cuenta o darla de baja lo invalida
    al instante. El rol se lee de la base en cada peticion, no del token.

    Todas las respuestas son JSON. Los errores tienen siempre la misma forma:

    ```json
    { "error": { "codigo": "DATOS_INVALIDOS", "mensaje": "...", "detalles": [] } }
    ```

    El usuario de la sesion expone solo `id`, `nombre`, `email` y `rol`; nunca
    el hash de la contrasena (RNF-08). El correo solo sale para su dueño y para
    el administrador; el perfil publico nunca lo muestra (RF-08).

    Un recurso privado ajeno responde 404 `NO_ENCONTRADO`, no 403: un 403
    confirmaria que el id existe.

    Cualquier ruta bajo `/api` que no exista responde 404 `RUTA_NO_ENCONTRADA`
    con esa misma forma de error: el router de la API termina en un manejador
    propio, asi que nunca devuelve el HTML de la aplicacion.

servers:
  - url: /api
    description: Mismo origen que el frontend

tags:
  - name: Autenticacion
    description: Registro, sesion y recuperacion de contrasena
  - name: Perfil
    description: Perfil propio, perfil publico y baja de cuenta (RF-05, RF-08, RF-09)
  - name: Catalogo
    description: Libros del catalogo propio (RF-10 a RF-13)
  - name: Publicaciones
    description: Publicar, explorar y retirar publicaciones, con su foto (RF-14 a RF-16)
  - name: Solicitudes
    description: Solicitudes e intercambios, reportes y valoraciones (RF-17 a RF-21, RF-24, RF-25)
  - name: Administracion
    description: Cuentas y bloqueo (RF-06, RF-07) e intercambios flagueados (RF-23, RF-24). Requiere rol administrador.

paths:
  /auth/registro:
    post:
      tags: [Autenticacion]
      operationId: registrar
      security: []
      summary: Crear una cuenta
      description: |
        Registra un usuario nuevo y devuelve su sesion ya iniciada.
        El correo se compara sin distinguir mayusculas de minusculas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoRegistro'
      responses:
        '201':
          description: Cuenta creada. Devuelve el token de sesion y el usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
        '400':
          $ref: '#/components/responses/EntradaInvalida'
        '409':
          description: Ya existe una cuenta con ese correo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: EMAIL_DUPLICADO
                  mensaje: Ya existe una cuenta con ese correo
                  detalles: []
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /auth/login:
    post:
      tags: [Autenticacion]
      operationId: iniciarSesion
      security: []
      summary: Iniciar sesion
      description: |
        Valida las credenciales y devuelve una sesion. Ante cualquier fallo
        responde el mismo error, sin distinguir si fallo el correo o la
        contrasena.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoLogin'
      responses:
        '200':
          description: Credenciales correctas. Devuelve el token de sesion y el usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
        '400':
          $ref: '#/components/responses/EntradaInvalida'
        '401':
          description: Correo o contrasena incorrectos. El mensaje es siempre el mismo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: CREDENCIALES_INVALIDAS
                  mensaje: El correo o la contrasena no son correctos
                  detalles: []
        '403':
          $ref: '#/components/responses/CuentaBloqueada'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /auth/yo:
    get:
      tags: [Autenticacion]
      operationId: usuarioActual
      summary: Datos del usuario de la sesion actual
      description: |
        Devuelve los datos del usuario dueño de la sesion, con su rol.
      security:
        - sesion: []
      responses:
        '200':
          description: Sesion valida.
          content:
            application/json:
              schema:
                type: object
                required: [usuario]
                properties:
                  usuario:
                    $ref: '#/components/schemas/UsuarioPublico'
        '401':
          description: |
            Falta la cabecera, el esquema no es Bearer, la firma no es valida,
            el token vencio o la sesion fue revocada. No se dice cual fue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: SESION_INVALIDA
                  mensaje: La sesion no es valida o expiro. Inicia sesion de nuevo.
                  detalles: []
        '403':
          $ref: '#/components/responses/CuentaBloqueada'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /auth/logout:
    post:
      tags: [Autenticacion]
      operationId: cerrarSesion
      summary: Cerrar la sesion actual (RF-03)
      description: |
        Revoca en el servidor la sesion del token usado: la peticion siguiente
        con ese token da 401. Las otras sesiones del mismo usuario siguen vivas.
      security:
        - sesion: []
      responses:
        '200':
          description: Sesion cerrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '401':
          $ref: '#/components/responses/SinSesion'

  /auth/recuperacion:
    post:
      tags: [Autenticacion]
      operationId: pedirRecuperacion
      security: []
      summary: Pedir un enlace de recuperacion de contrasena
      description: |
        Si el correo pertenece a una cuenta, envia un enlace de recuperacion.
        La respuesta es siempre la misma, exista o no la cuenta, para no revelar
        que correos estan registrados.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoRecuperacion'
      responses:
        '200':
          description: Pedido recibido. Mismo cuerpo exista o no la cuenta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
              example:
                mensaje: Si el correo esta registrado, te enviamos un enlace para recuperar la contrasena.
        '400':
          $ref: '#/components/responses/EntradaInvalida'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /auth/recuperacion/confirmar:
    post:
      tags: [Autenticacion]
      operationId: confirmarRecuperacion
      security: []
      summary: Poner una contrasena nueva con el token del enlace
      description: |
        Valida el token de un solo uso que llego por correo y cambia la
        contrasena.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoConfirmacion'
      responses:
        '200':
          description: Contrasena actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
              example:
                mensaje: Tu contrasena fue actualizada. Ya podes iniciar sesion.
        '400':
          description: |
            Entrada invalida (`DATOS_INVALIDOS`, `JSON_INVALIDO`) o token malo,
            vencido o ya usado (`TOKEN_INVALIDO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tokenInvalido:
                  summary: Token malo, vencido o ya usado
                  value:
                    error:
                      codigo: TOKEN_INVALIDO
                      mensaje: El enlace no es valido o ya vencio
                      detalles: []
                datosInvalidos:
                  summary: Faltan campos o no cumplen las reglas
                  value:
                    error:
                      codigo: DATOS_INVALIDOS
                      mensaje: Los datos enviados no son validos
                      detalles:
                        - campo: token
                          mensaje: El token es obligatorio
                        - campo: contrasena
                          mensaje: La contrasena debe tener al menos 8 caracteres
                jsonInvalido:
                  $ref: '#/components/examples/JsonInvalido'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /perfil:
    get:
      tags: [Perfil]
      operationId: verPerfil
      summary: Perfil propio (RF-05)
      security:
        - sesion: []
      responses:
        '200':
          description: Perfil, con el correo (solo para su dueño).
          content:
            application/json:
              schema:
                type: object
                required: [perfil]
                properties:
                  perfil:
                    $ref: '#/components/schemas/Perfil'
        '401':
          $ref: '#/components/responses/SinSesion'
    put:
      tags: [Perfil]
      operationId: modificarNombre
      summary: Modificar el nombre (RF-05)
      description: Solo el nombre; el correo no se puede cambiar. Obligatorio, hasta 80 caracteres.
      security:
        - sesion: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre]
              properties:
                nombre:
                  type: string
                  minLength: 1
                  maxLength: 80
      responses:
        '200':
          description: Perfil actualizado.
          content:
            application/json:
              schema:
                type: object
                required: [perfil]
                properties:
                  perfil:
                    $ref: '#/components/schemas/Perfil'
        '400':
          $ref: '#/components/responses/EntradaInvalida'
        '401':
          $ref: '#/components/responses/SinSesion'
    delete:
      tags: [Perfil]
      operationId: darDeBaja
      summary: Dar de baja la cuenta (RF-09)
      description: |
        Pide la contraseña. En una sola transaccion archiva los libros,
        anonimiza la cuenta (nombre «Cuenta eliminada», correo
        `eliminada+<id>@letrados.invalid`) y revoca todas sus sesiones.
      security:
        - sesion: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contrasena]
              properties:
                contrasena:
                  type: string
                  format: password
      responses:
        '200':
          description: Cuenta dada de baja.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          $ref: '#/components/responses/EntradaInvalida'
        '401':
          $ref: '#/components/responses/ContrasenaIncorrecta'

  /perfil/contrasena:
    put:
      tags: [Perfil]
      operationId: cambiarContrasena
      summary: Cambiar la contraseña (RF-05)
      description: |
        Verifica la contraseña actual, cambia el hash y revoca las demas
        sesiones del usuario, no la que hizo el cambio.
      security:
        - sesion: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contrasenaActual, contrasenaNueva]
              properties:
                contrasenaActual:
                  type: string
                  format: password
                contrasenaNueva:
                  type: string
                  format: password
                  minLength: 8
                  description: Al menos una letra y un numero.
      responses:
        '200':
          description: Contraseña cambiada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          $ref: '#/components/responses/EntradaInvalida'
        '401':
          $ref: '#/components/responses/ContrasenaIncorrecta'

  /usuarios/{id}:
    get:
      tags: [Perfil]
      operationId: perfilPublico
      summary: Perfil publico (RF-08)
      description: |
        Publico, sin sesion. Nombre, reputacion y publicaciones activas; nunca
        el correo, el rol ni el estado. Una cuenta eliminada responde 200 con
        «Cuenta eliminada» para no romper los enlaces del historial (RF-09).
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Perfil publico.
          content:
            application/json:
              schema:
                type: object
                required: [usuario]
                properties:
                  usuario:
                    $ref: '#/components/schemas/PerfilPublico'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /usuarios/{id}/valoraciones:
    get:
      tags: [Perfil]
      operationId: listarValoracionesRecibidas
      summary: Valoraciones recibidas por un usuario (RF-27)
      description: |
        Publico, sin sesion. Las valoraciones que recibio la cuenta, de la mas
        nueva a la mas vieja, con quien la escribio y el intercambio que la
        habilito. Una cuenta eliminada responde 200 con la lista vacia, igual
        que su perfil publico.
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Pagina'
        - name: porPagina
          in: query
          description: Fuera de rango se recorta, no es error. Aca el defecto es 10.
          schema: {type: integer, minimum: 1, maximum: 50, default: 10}
      responses:
        '200':
          description: Pagina de valoraciones recibidas.
          content:
            application/json:
              schema:
                type: object
                required: [datos, paginacion]
                properties:
                  datos:
                    type: array
                    items:
                      $ref: '#/components/schemas/ValoracionRecibida'
                  paginacion:
                    $ref: '#/components/schemas/Paginacion'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /libros:
    get:
      tags: [Catalogo]
      operationId: listarLibros
      summary: Consultar el catalogo propio (RF-13)
      description: |
        Sin archivados, del mas nuevo al mas viejo. `q` busca por subcadena en
        titulo o autor sin distinguir mayusculas.
      security:
        - sesion: []
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Pagina del catalogo.
          content:
            application/json:
              schema:
                type: object
                required: [datos, paginacion]
                properties:
                  datos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Libro'
                  paginacion:
                    $ref: '#/components/schemas/Paginacion'
        '401':
          $ref: '#/components/responses/SinSesion'
    post:
      tags: [Catalogo]
      operationId: agregarLibro
      summary: Agregar un libro (RF-10)
      security:
        - sesion: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoLibro'
      responses:
        '201':
          description: Libro creado.
          content:
            application/json:
              schema:
                type: object
                required: [libro]
                properties:
                  libro:
                    $ref: '#/components/schemas/Libro'
        '400':
          $ref: '#/components/responses/EntradaInvalida'
        '401':
          $ref: '#/components/responses/SinSesion'

  /libros/{id}:
    put:
      tags: [Catalogo]
      operationId: modificarLibro
      summary: Modificar un libro propio (RF-11)
      description: |
        Reemplazo de los tres campos. La cantidad no puede quedar por debajo de
        los ejemplares reservados: 409 con el minimo en el mensaje.
      security:
        - sesion: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoLibro'
      responses:
        '200':
          description: Libro modificado.
          content:
            application/json:
              schema:
                type: object
                required: [libro]
                properties:
                  libro:
                    $ref: '#/components/schemas/Libro'
        '400':
          $ref: '#/components/responses/EntradaInvalida'
        '401':
          $ref: '#/components/responses/SinSesion'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/EstadoInvalido'
    delete:
      tags: [Catalogo]
      operationId: retirarLibro
      summary: Retirar un libro propio (RF-12)
      description: |
        Con publicaciones o solicitudes activas -> 409. Con intercambios
        completados se archiva; si no, se elimina. La respuesta dice cual.
      security:
        - sesion: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Libro retirado.
          content:
            application/json:
              schema:
                type: object
                required: [resultado]
                properties:
                  resultado:
                    type: string
                    enum: [archivado, eliminado]
        '401':
          $ref: '#/components/responses/SinSesion'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/EstadoInvalido'

  /publicaciones:
    get:
      tags: [Publicaciones]
      operationId: listarPublicaciones
      summary: Explorar las publicaciones activas (RF-15)
      description: |
        Publico, sin sesion. Publicaciones `activas` de libros con ejemplares
        disponibles y de cuentas activas, de la mas nueva a la mas vieja. `q`
        busca por subcadena en titulo o autor sin distinguir mayusculas.

        Con sesion, las propias vienen con `esMia: true` (la interfaz las
        marca «Tuya» y no ofrece solicitarlas); un token invalido se ignora y
        la respuesta es la publica.
      security: []
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Pagina de publicaciones activas.
          content:
            application/json:
              schema:
                type: object
                required: [datos, paginacion]
                properties:
                  datos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Publicacion'
                  paginacion:
                    $ref: '#/components/schemas/Paginacion'
    post:
      tags: [Publicaciones]
      operationId: publicarLibro
      summary: Publicar un libro propio (RF-14)
      description: |
        Publica UN ejemplar de un libro del catalogo propio, con una nota
        opcional. Un libro tiene como maximo una publicacion vigente.

        - Libro inexistente, ajeno o archivado -> 404, para no revelar que
          existe.
        - Sin ejemplares disponibles o ya publicado -> 409.
      security:
        - sesion: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoPublicacion'
      responses:
        '201':
          description: Publicacion creada, en estado `activa`.
          content:
            application/json:
              schema:
                type: object
                required: [publicacion]
                properties:
                  publicacion:
                    $ref: '#/components/schemas/Publicacion'
        '400':
          $ref: '#/components/responses/EntradaInvalida'
        '401':
          $ref: '#/components/responses/SinSesion'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/EstadoInvalido'

  /publicaciones/{id}:
    get:
      tags: [Publicaciones]
      operationId: verPublicacion
      summary: Detalle de una publicacion (RF-16)
      description: |
        Publico, sin sesion y en cualquier estado, para que los enlaces del
        historial no se rompan. Con sesion, `esMia` dice si es de quien mira.
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/PublicacionDevuelta'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    put:
      tags: [Publicaciones]
      operationId: modificarNotaPublicacion
      summary: Cambiar la nota de una publicacion (RF-14)
      description: |
        Reemplazo, no parche: sin `nota` en el cuerpo, la borra. Solo sobre
        una publicacion propia y `activa`: una ajena responde 404, no 403; en
        otro estado responde 409.
      security:
        - sesion: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoNota'
      responses:
        '200':
          $ref: '#/components/responses/PublicacionDevuelta'
        '400':
          $ref: '#/components/responses/EntradaInvalida'
        '401':
          $ref: '#/components/responses/SinSesion'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/EstadoInvalido'
    delete:
      tags: [Publicaciones]
      operationId: retirarPublicacion
      summary: Retirar una publicacion (RF-14)
      description: |
        Solo una propia y `activa`. Deja de verse en Explorar y el libro queda
        libre para volver a publicarse. Sus solicitudes pendientes pasan a
        `cancelada`, a nombre del dueño, en la misma transaccion.
      security:
        - sesion: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Publicacion retirada.
          content:
            application/json:
              schema:
                type: object
                required: [resultado]
                properties:
                  resultado:
                    type: string
                    enum: [retirada]
        '401':
          $ref: '#/components/responses/SinSesion'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/EstadoInvalido'

  /publicaciones/{id}/foto:
    get:
      tags: [Publicaciones]
      operationId: verFotoPublicacion
      summary: La foto de la publicacion (RF-16)
      description: |
        Publico, sin sesion y en cualquier estado. Devuelve los bytes de la
        imagen con su propio `Content-Type`, no JSON. Una publicacion sin
        foto, inexistente o con id invalido responde 404 (ese error si es JSON,
        como todos).
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Los bytes de la imagen, con su tipo.
          headers:
            Cache-Control:
              description: Siempre `public, max-age=300`.
              schema: {type: string}
          content:
            image/jpeg:
              schema: {type: string, format: binary}
            image/png:
              schema: {type: string, format: binary}
            image/webp:
              schema: {type: string, format: binary}
        '404':
          $ref: '#/components/responses/NoEncontrado'
    put:
      tags: [Publicaciones]
      operationId: subirFotoPublicacion
      summary: Subir o reemplazar la foto (RF-14)
      description: |
        El unico endpoint que no recibe JSON: el cuerpo es la imagen cruda,
        sin multipart, y el tipo se lee del header `Content-Type`. El tope es
        de 2 MB. Solo sobre una publicacion propia y `activa`.

        - Tipo no admitido o foto vacia -> 400 con el detalle en el campo `foto`.
        - Mas de 2 MB -> 413 `ARCHIVO_DEMASIADO_GRANDE`.
      security:
        - sesion: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        description: La imagen cruda como cuerpo, con su tipo en `Content-Type`.
        content:
          image/jpeg:
            schema: {type: string, format: binary}
          image/png:
            schema: {type: string, format: binary}
          image/webp:
            schema: {type: string, format: binary}
      responses:
        '200':
          $ref: '#/components/responses/PublicacionDevuelta'
        '400':
          $ref: '#/components/responses/EntradaInvalida'
        '401':
          $ref: '#/components/responses/SinSesion'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/EstadoInvalido'
        '413':
          $ref: '#/components/responses/ArchivoDemasiadoGrande'
    delete:
      tags: [Publicaciones]
      operationId: quitarFotoPublicacion
      summary: Quitar la foto (RF-14)
      description: |
        Solo sobre una publicacion propia y `activa`. Quitarla cuando no hay
        foto no es error: el resultado es el mismo.
      security:
        - sesion: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/PublicacionDevuelta'
        '401':
          $ref: '#/components/responses/SinSesion'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/EstadoInvalido'

  /solicitudes:
    post:
      tags: [Solicitudes]
      operationId: crearSolicitud
      summary: Solicitar un intercambio (RF-17)
      description: |
        Solicita una publicacion ajena ofreciendo un libro propio. No reserva
        nada: la disponibilidad se vuelve a verificar al aceptar.

        - Publicacion inexistente -> 404.
        - Publicacion propia o ya no disponible, libro ofrecido fuera del
          catalogo o sin ejemplares, o ya hay una pendiente de esta persona
          sobre la publicacion -> 409.
      security:
        - sesion: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoSolicitud'
      responses:
        '201':
          description: Solicitud creada, en estado `pendiente`.
          content:
            application/json:
              schema:
                type: object
                required: [solicitud]
                properties:
                  solicitud:
                    $ref: '#/components/schemas/Solicitud'
        '400':
          $ref: '#/components/responses/EntradaInvalida'
        '401':
          $ref: '#/components/responses/SinSesion'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/EstadoInvalido'
    get:
      tags: [Solicitudes]
      operationId: listarSolicitudes
      summary: Mis solicitudes (RF-18)
      description: |
        Las solicitudes del usuario, de la mas nueva a la mas vieja: las
        `recibidas` sobre sus publicaciones (por defecto) o las `enviadas`.
        Antes de listar se barren los plazos vencidos: una solicitud que
        vencio sin las dos confirmaciones ya aparece `flagueada`.
      security:
        - sesion: []
      parameters:
        - name: rol
          in: query
          description: Cualquier valor distinto de `enviadas` lista las recibidas.
          schema:
            type: string
            enum: [recibidas, enviadas]
            default: recibidas
        - name: estado
          in: query
          description: Un valor desconocido se ignora.
          schema:
            $ref: '#/components/schemas/EstadoSolicitud'
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Pagina de solicitudes.
          content:
            application/json:
              schema:
                type: object
                required: [datos, paginacion]
                properties:
                  datos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Solicitud'
                  paginacion:
                    $ref: '#/components/schemas/Paginacion'
        '401':
          $ref: '#/components/responses/SinSesion'

  /solicitudes/{id}:
    get:
      tags: [Solicitudes]
      operationId: verSolicitud
      summary: Ver una solicitud (RF-18)
      description: |
        Una solicitud de la que el usuario es parte. Una ajena responde 404,
        no 403, para no revelar que existe.
      security:
        - sesion: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/SolicitudDevuelta'
        '401':
          $ref: '#/components/responses/SinSesion'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /solicitudes/{id}/aceptar:
    post:
      tags: [Solicitudes]
      operationId: aceptarSolicitud
      summary: Aceptar una solicitud pendiente (RF-19)
      description: |
        Solo el dueño de la publicacion. En una transaccion: reserva un
        ejemplar de cada libro, deja la publicacion `reservada` (sale de
        Explorar), rechaza las demas pendientes sobre ella y fija el plazo de
        confirmacion (RF-22).

        - El solicitante que intenta aceptar -> 403 (la excepcion al 404 de
          los recursos ajenos).
        - Ya no pendiente, o un libro que se quedo sin ejemplares disponibles
          -> 409 nombrandolo, sin cambiar nada.
      security:
        - sesion: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/SolicitudDevuelta'
        '401':
          $ref: '#/components/responses/SinSesion'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/EstadoInvalido'

  /solicitudes/{id}/rechazar:
    post:
      tags: [Solicitudes]
      operationId: rechazarSolicitud
      summary: Rechazar una solicitud pendiente (RF-19)
      description: |
        Solo el dueño de la publicacion; el solicitante que intenta rechazar
        recibe 403. La publicacion sigue disponible y las demas pendientes no
        cambian. Ya no pendiente -> 409.
      security:
        - sesion: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/SolicitudDevuelta'
        '401':
          $ref: '#/components/responses/SinSesion'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/EstadoInvalido'

  /solicitudes/{id}/cancelar:
    post:
      tags: [Solicitudes]
      operationId: cancelarSolicitud
      summary: Cancelar una operacion (RF-20)
      description: |
        Cualquiera de las partes, mientras la solicitud este `pendiente`,
        `aceptada` o `flagueada`. Si ya habia reservas, libera un ejemplar de
        cada libro y la publicacion vuelve a `activa`, otra vez en Explorar.
        Rechazada, cancelada o completada -> 409.
      security:
        - sesion: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/SolicitudDevuelta'
        '401':
          $ref: '#/components/responses/SinSesion'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/EstadoInvalido'

  /solicitudes/{id}/confirmar:
    post:
      tags: [Solicitudes]
      operationId: confirmarSolicitud
      summary: Confirmar que el intercambio se concreto (RF-21)
      description: |
        Cada parte confirma una sola vez, con la solicitud `aceptada` o
        `flagueada` (el flagueo avisa, no congela). Con las dos
        confirmaciones, en la misma transaccion: pasa a `completada`,
        descuenta un ejemplar de cada libro y cierra la publicacion.

        - Ni aceptada ni flagueada, o confirmar dos veces -> 409.
      security:
        - sesion: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/SolicitudDevuelta'
        '401':
          $ref: '#/components/responses/SinSesion'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/EstadoInvalido'

  /solicitudes/{id}/reportes:
    post:
      tags: [Solicitudes]
      operationId: reportarInconveniente
      summary: Reportar un inconveniente (RF-24)
      description: |
        Mientras el intercambio esta `flagueada`, cualquiera de las dos partes
        cuenta que paso, una o mas veces. El administrador los lee junto al
        intercambio en `/admin/flagueados`. No flagueado -> 409.
      security:
        - sesion: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoReporte'
      responses:
        '201':
          description: Reporte registrado.
          content:
            application/json:
              schema:
                type: object
                required: [reporte]
                properties:
                  reporte:
                    $ref: '#/components/schemas/Reporte'
        '400':
          $ref: '#/components/responses/EntradaInvalida'
        '401':
          $ref: '#/components/responses/SinSesion'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/EstadoInvalido'

  /solicitudes/{id}/valoracion:
    post:
      tags: [Solicitudes]
      operationId: valorarContraparte
      summary: Valorar a la contraparte (RF-25)
      description: |
        Despues de completar el intercambio, cada parte valora una sola vez a
        la otra, con un puntaje entero de 1 a 5 y un comentario opcional. No
        se edita ni se borra. No completado, o ya valorado, -> 409.
      security:
        - sesion: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoValoracion'
      responses:
        '201':
          description: Valoracion registrada.
          content:
            application/json:
              schema:
                type: object
                required: [valoracion]
                properties:
                  valoracion:
                    $ref: '#/components/schemas/Valoracion'
        '400':
          $ref: '#/components/responses/EntradaInvalida'
        '401':
          $ref: '#/components/responses/SinSesion'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/EstadoInvalido'

  /admin/cuentas:
    get:
      tags: [Administracion]
      operationId: listarCuentas
      summary: Listar cuentas (RF-07)
      description: Busqueda por nombre o correo, filtro por estado y sesiones activas por cuenta.
      security:
        - sesion: []
      parameters:
        - $ref: '#/components/parameters/Q'
        - name: estado
          in: query
          description: Un valor desconocido se ignora.
          schema:
            type: string
            enum: [activa, bloqueada, eliminada]
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Pagina de cuentas.
          content:
            application/json:
              schema:
                type: object
                required: [datos, paginacion]
                properties:
                  datos:
                    type: array
                    items:
                      $ref: '#/components/schemas/CuentaAdmin'
                  paginacion:
                    $ref: '#/components/schemas/Paginacion'
        '401':
          $ref: '#/components/responses/SinSesion'
        '403':
          $ref: '#/components/responses/AccesoDenegado'

  /admin/cuentas/{id}/bloqueo:
    post:
      tags: [Administracion]
      operationId: bloquearCuenta
      summary: Bloquear una cuenta (RF-07)
      description: Pasa la cuenta a `bloqueada` y revoca todas sus sesiones, en una transaccion.
      security:
        - sesion: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/CuentaActualizada'
        '401':
          $ref: '#/components/responses/SinSesion'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/EstadoInvalido'
    delete:
      tags: [Administracion]
      operationId: desbloquearCuenta
      summary: Desbloquear una cuenta (RF-07)
      description: Vuelve a `activa`. No resucita sesiones; la persona entra de nuevo con su contraseña.
      security:
        - sesion: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/CuentaActualizada'
        '401':
          $ref: '#/components/responses/SinSesion'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/EstadoInvalido'

  /admin/flagueados:
    get:
      tags: [Administracion]
      operationId: listarFlagueados
      summary: Intercambios flagueados (RF-23, RF-24)
      description: |
        Solo administrador, y solo consulta. Los intercambios que alguna vez
        vencieron sin las dos confirmaciones, con las dos partes, los dos
        libros, el estado actual y sus reportes. Por defecto solo los que
        siguen `flagueada`; `estado=todos` trae tambien los que despues se
        completaron o cancelaron. Antes de listar se barren los plazos
        vencidos: lo que vencio recien ya aparece.
      security:
        - sesion: []
      parameters:
        - name: estado
          in: query
          description: Cualquier valor distinto de `todos` deja solo los flagueados.
          schema:
            type: string
            enum: [flagueada, todos]
            default: flagueada
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Pagina de intercambios flagueados.
          content:
            application/json:
              schema:
                type: object
                required: [datos, paginacion]
                properties:
                  datos:
                    type: array
                    items:
                      $ref: '#/components/schemas/IntercambioFlagueado'
                  paginacion:
                    $ref: '#/components/schemas/Paginacion'
        '401':
          $ref: '#/components/responses/SinSesion'
        '403':
          $ref: '#/components/responses/AccesoDenegado'

components:
  securitySchemes:
    sesion:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token que devuelven registro e inicio de sesion (claims `sub`, `rol`
        y `jti`), en la cabecera
        `Authorization: Bearer <token>`. JWT HS256 con el id del usuario en `sub`.

  schemas:
    UsuarioPublico:
      type: object
      description: Datos del usuario de la sesion (RNF-08).
      required: [id, nombre, email, rol]
      properties:
        id:
          type: string
          description: Identificador numerico del usuario, serializado como texto.
          example: '1'
        nombre:
          type: string
          maxLength: 80
          example: Ana Gomez
        email:
          type: string
          format: email
          maxLength: 254
          example: ana@example.com
        rol:
          $ref: '#/components/schemas/Rol'
      additionalProperties: false

    Rol:
      type: string
      enum: [usuario, administrador]
      description: Toda cuenta nueva nace `usuario` (RF-06).

    Ok:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true

    Reputacion:
      type: object
      required: [promedio, cantidad]
      properties:
        promedio:
          type: [number, 'null']
          description: null mientras no haya valoraciones («Sin valoraciones»).
        cantidad:
          type: integer

    Perfil:
      type: object
      required: [id, nombre, email, rol, creadoEn, reputacion]
      properties:
        id: {type: string}
        nombre: {type: string}
        email: {type: string, format: email}
        rol: {$ref: '#/components/schemas/Rol'}
        creadoEn: {type: string, format: date-time}
        reputacion: {$ref: '#/components/schemas/Reputacion'}

    PerfilPublico:
      type: object
      required: [id, nombre, eliminada, reputacion, publicaciones]
      properties:
        id: {type: string}
        nombre: {type: string, example: Ana Gomez}
        eliminada: {type: boolean}
        reputacion: {$ref: '#/components/schemas/Reputacion'}
        publicaciones:
          type: array
          description: Publicaciones activas (llegan con el modulo 4; hoy vacia).
          items: {type: object}
      additionalProperties: false

    Libro:
      type: object
      required: [id, titulo, autor, total, reservada, disponible, publicado, tieneHistorial, creadoEn]
      properties:
        id: {type: string, example: '3'}
        titulo: {type: string, example: Rayuela}
        autor: {type: string, example: Julio Cortazar}
        total: {type: integer, minimum: 0, example: 2}
        reservada: {type: integer, minimum: 0, example: 1}
        disponible:
          type: integer
          description: total - reservada. Se calcula, nunca se guarda.
          example: 1
        publicado: {type: boolean}
        tieneHistorial:
          type: boolean
          description: Si participo en intercambios completados (al retirarlo se archiva).
        creadoEn: {type: string, format: date-time}

    PedidoLibro:
      type: object
      required: [titulo, autor, cantidad]
      properties:
        titulo: {type: string, minLength: 1, maxLength: 200}
        autor: {type: string, minLength: 1, maxLength: 200}
        cantidad:
          type: integer
          minimum: 1
          description: Entero >= 1. Tambien se acepta como texto ("3").

    Publicacion:
      type: object
      description: |
        Una publicacion ofrece UN ejemplar de un libro del catalogo. Explorar,
        el detalle y el perfil publico usan esta misma forma.
      required: [id, estado, nota, tieneFoto, libro, propietario, esMia, creadaEn]
      properties:
        id: {type: string, example: '7'}
        estado:
          type: string
          enum: [activa, reservada, cerrada, retirada]
          description: |
            Solo las `activas` salen en Explorar. A `reservada` y `cerrada` la
            mueven las solicitudes; a `retirada` la mueve su dueño.
        nota:
          type: [string, 'null']
          maxLength: 300
        tieneFoto: {type: boolean}
        libro:
          type: object
          description: Los datos del libro al dia, leidos del catalogo.
          required: [id, titulo, autor, editorial, anio, edicion, isbn, estadoConservacion, descripcion, disponible]
          properties:
            id: {type: string}
            titulo: {type: string, example: Rayuela}
            autor: {type: string, example: Julio Cortazar}
            editorial: {type: [string, 'null']}
            anio: {type: [integer, 'null']}
            edicion: {type: [string, 'null']}
            isbn: {type: [string, 'null'], description: Sin guiones ni espacios.}
            estadoConservacion:
              type: [string, 'null']
              enum: [nuevo, muy_bueno, bueno, gastado, null]
            descripcion: {type: [string, 'null']}
            disponible:
              type: integer
              description: total - reservada. Se calcula, nunca se guarda.
        propietario:
          type: object
          required: [id, nombre, reputacion]
          properties:
            id: {type: string}
            nombre: {type: string}
            reputacion: {$ref: '#/components/schemas/Reputacion'}
        esMia:
          type: boolean
          description: Si la publicacion es de quien consulta; false sin sesion.
        creadaEn: {type: string, format: date-time}

    PedidoPublicacion:
      type: object
      required: [libroId]
      properties:
        libroId:
          type: [string, integer]
          description: Un libro del catalogo propio. Se acepta `3` o `"3"`.
          example: '3'
        nota:
          type: [string, 'null']
          maxLength: 300
          description: Opcional, recortada. Ausente, vacia o null queda en null.

    PedidoNota:
      type: object
      description: Reemplazo de la nota, no parche. Sin `nota`, la borra.
      properties:
        nota:
          type: [string, 'null']
          maxLength: 300

    EstadoSolicitud:
      type: string
      enum: [pendiente, aceptada, rechazada, cancelada, completada, flagueada]
      description: |
        `pendiente` -> `aceptada` -> `completada` es el camino feliz.
        `flagueada` es una aceptada cuyo plazo vencio sin las dos
        confirmaciones (RF-23); avisa, no congela.

    ParteSolicitud:
      type: object
      required: [id, nombre]
      properties:
        id: {type: string}
        nombre: {type: string}

    Solicitud:
      type: object
      description: |
        Une el libro de una publicacion (`libroSolicitado`) con un libro del
        solicitante (`libroOfrecido`). Siempre se ve como una de sus partes;
        `contraparte`, `confirmadaPorMi` y `miValoracion` dependen de quien mira.
      required: [id, estado, soyPropietario, publicacionId, contraparte,
                 libroSolicitado, libroOfrecido, venceEn, flagueadaEn,
                 motivoFlagueo, confirmadaPorMi, confirmadaPorContraparte,
                 miValoracion, puedo, creadaEn]
      properties:
        id: {type: string}
        estado: {$ref: '#/components/schemas/EstadoSolicitud'}
        soyPropietario:
          type: boolean
          description: Si quien mira es el dueño de la publicacion.
        publicacionId: {type: string}
        contraparte: {$ref: '#/components/schemas/ParteSolicitud'}
        libroSolicitado: {$ref: '#/components/schemas/LibroDeSolicitud'}
        libroOfrecido: {$ref: '#/components/schemas/LibroDeSolicitud'}
        venceEn:
          type: [string, 'null']
          format: date-time
          description: Plazo de confirmacion; se fija al aceptar (RF-22).
        flagueadaEn:
          type: [string, 'null']
          format: date-time
          description: Cuando vencio sin las dos confirmaciones (RF-23).
        motivoFlagueo: {type: [string, 'null']}
        confirmadaPorMi: {type: boolean}
        confirmadaPorContraparte: {type: boolean}
        miValoracion:
          type: [integer, 'null']
          description: El puntaje que quien mira ya dio, si valoro (RF-25).
        puedo: {$ref: '#/components/schemas/PuedoSolicitud'}
        creadaEn: {type: string, format: date-time}

    LibroDeSolicitud:
      type: object
      required: [id, titulo, autor]
      properties:
        id: {type: string}
        titulo: {type: string}
        autor: {type: string}

    PuedoSolicitud:
      type: object
      description: |
        Lo que quien mira puede hacer con la solicitud, con las mismas reglas
        que validan cada accion: la interfaz dibuja los botones con esto y no
        las repite.
      required: [aceptar, rechazar, cancelar, confirmar, reportar, valorar]
      properties:
        aceptar: {type: boolean}
        rechazar: {type: boolean}
        cancelar: {type: boolean}
        confirmar: {type: boolean}
        reportar: {type: boolean}
        valorar: {type: boolean}

    PedidoSolicitud:
      type: object
      required: [publicacionId, libroOfrecidoId]
      properties:
        publicacionId:
          type: [string, integer]
          description: La publicacion ajena que se solicita. Se acepta `7` o `"7"`.
        libroOfrecidoId:
          type: [string, integer]
          description: Un libro del catalogo propio que se ofrece a cambio.

    Reporte:
      type: object
      required: [id, autor, descripcion, creadoEn]
      properties:
        id: {type: string}
        autor: {$ref: '#/components/schemas/ParteSolicitud'}
        descripcion: {type: string, maxLength: 1000}
        creadoEn: {type: string, format: date-time}

    PedidoReporte:
      type: object
      required: [descripcion]
      properties:
        descripcion:
          type: string
          minLength: 1
          maxLength: 1000
          description: Que paso con el intercambio. Recortada.

    Valoracion:
      type: object
      required: [id, puntaje, comentario, creadaEn]
      properties:
        id: {type: string}
        puntaje: {type: integer, minimum: 1, maximum: 5}
        comentario: {type: [string, 'null'], maxLength: 500}
        creadaEn: {type: string, format: date-time}

    PedidoValoracion:
      type: object
      required: [puntaje]
      properties:
        puntaje:
          type: [integer, string]
          description: Entero de 1 a 5. Se acepta `5` o `"5"`.
        comentario:
          type: [string, 'null']
          maxLength: 500
          description: Opcional, recortado; vacio queda en null.

    ValoracionRecibida:
      description: |
        Una valoracion del perfil publico (RF-27), con quien la escribio y el
        intercambio que la habilito.
      allOf:
        - $ref: '#/components/schemas/Valoracion'
        - type: object
          required: [autor, intercambio]
          properties:
            autor: {$ref: '#/components/schemas/ParteSolicitud'}
            intercambio:
              type: object
              required: [id, libroSolicitado, libroOfrecido]
              properties:
                id: {type: string}
                libroSolicitado:
                  type: object
                  required: [titulo]
                  properties:
                    titulo: {type: string}
                libroOfrecido:
                  type: object
                  required: [titulo]
                  properties:
                    titulo: {type: string}

    IntercambioFlagueado:
      type: object
      description: |
        Un intercambio que alguna vez vencio sin las dos confirmaciones, con
        sus reportes, para el panel del administrador (RF-23, RF-24).
      required: [id, estado, flagueadaEn, motivo, venceEn, propietario,
                 solicitante, libroSolicitado, libroOfrecido, reportes]
      properties:
        id: {type: string}
        estado: {$ref: '#/components/schemas/EstadoSolicitud'}
        flagueadaEn: {type: [string, 'null'], format: date-time}
        motivo: {type: [string, 'null']}
        venceEn: {type: [string, 'null'], format: date-time}
        propietario: {$ref: '#/components/schemas/ParteSolicitud'}
        solicitante: {$ref: '#/components/schemas/ParteSolicitud'}
        libroSolicitado:
          type: object
          required: [titulo, autor]
          properties:
            titulo: {type: string}
            autor: {type: string}
        libroOfrecido:
          type: object
          required: [titulo, autor]
          properties:
            titulo: {type: string}
            autor: {type: string}
        reportes:
          type: array
          items:
            $ref: '#/components/schemas/Reporte'

    CuentaAdmin:
      type: object
      required: [id, nombre, email, rol, estado, creadoEn, sesionesActivas]
      properties:
        id: {type: string}
        nombre: {type: string}
        email: {type: string}
        rol: {$ref: '#/components/schemas/Rol'}
        estado:
          type: string
          enum: [activa, bloqueada, eliminada]
        creadoEn: {type: string, format: date-time}
        sesionesActivas: {type: integer}

    Paginacion:
      type: object
      required: [pagina, porPagina, total]
      properties:
        pagina: {type: integer, minimum: 1}
        porPagina: {type: integer, minimum: 1, maximum: 50}
        total: {type: integer, description: Total de filas que cumplen el filtro.}

    Sesion:
      type: object
      required: [token, usuario]
      properties:
        token:
          type: string
          description: JWT de sesion. Su duracion la fija `JWT_VENCIMIENTO` (por defecto 24 h).
        usuario:
          $ref: '#/components/schemas/UsuarioPublico'

    Mensaje:
      type: object
      required: [mensaje]
      properties:
        mensaje:
          type: string

    PedidoRegistro:
      type: object
      required: [nombre, email, contrasena]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 80
          description: Se recortan los espacios de los bordes antes de validar.
          example: Ana Gomez
        email:
          type: string
          format: email
          maxLength: 254
          example: ana@example.com
        contrasena:
          type: string
          format: password
          minLength: 8
          example: una-clave-larga

    PedidoLogin:
      type: object
      required: [email, contrasena]
      properties:
        email:
          type: string
          minLength: 1
          example: ana@example.com
        contrasena:
          type: string
          format: password
          minLength: 1
          example: una-clave-larga

    PedidoRecuperacion:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: ana@example.com

    PedidoConfirmacion:
      type: object
      required: [token, contrasena]
      properties:
        token:
          type: string
          minLength: 1
          description: Token de un solo uso que llega en el enlace del correo.
        contrasena:
          type: string
          format: password
          minLength: 8
          example: otra-clave-larga

    Error:
      type: object
      description: Forma unica de todos los errores de la API.
      required: [error]
      properties:
        error:
          type: object
          required: [codigo, mensaje, detalles]
          properties:
            codigo:
              type: string
              description: Identificador estable del error, en mayusculas.
              enum:
                - DATOS_INVALIDOS
                - JSON_INVALIDO
                - EMAIL_DUPLICADO
                - CREDENCIALES_INVALIDAS
                - SESION_INVALIDA
                - TOKEN_INVALIDO
                - CUENTA_BLOQUEADA
                - ACCESO_DENEGADO
                - CONTRASENA_INCORRECTA
                - NO_ENCONTRADO
                - ESTADO_INVALIDO
                - ARCHIVO_DEMASIADO_GRANDE
                - RUTA_NO_ENCONTRADA
                - NO_IMPLEMENTADO
                - ERROR_INTERNO
            mensaje:
              type: string
              description: Texto para el usuario final. Nunca lleva datos internos.
            detalles:
              type: array
              description: Errores puntuales por campo. Vacio cuando no aplica.
              items:
                $ref: '#/components/schemas/DetalleError'

    DetalleError:
      type: object
      required: [mensaje]
      properties:
        campo:
          type: string
          example: email
        mensaje:
          type: string
          example: El correo no tiene un formato valido

  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Un id que no es entero positivo responde 404.
      schema: {type: string, pattern: '^[1-9][0-9]*$'}
    Q:
      name: q
      in: query
      description: Busqueda por subcadena, sin distinguir mayusculas.
      schema: {type: string}
    Pagina:
      name: pagina
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    PorPagina:
      name: porPagina
      in: query
      description: Fuera de rango se recorta, no es error.
      schema: {type: integer, minimum: 1, maximum: 50, default: 20}

  examples:
    JsonInvalido:
      summary: El cuerpo no se pudo leer como JSON
      value:
        error:
          codigo: JSON_INVALIDO
          mensaje: El cuerpo de la peticion no es JSON valido
          detalles: []

  responses:
    EntradaInvalida:
      description: |
        La entrada no cumple las reglas (`DATOS_INVALIDOS`, con un detalle por
        cada campo que fallo) o el cuerpo no es JSON valido (`JSON_INVALIDO`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            datosInvalidos:
              summary: Uno o mas campos no cumplen las reglas
              value:
                error:
                  codigo: DATOS_INVALIDOS
                  mensaje: Los datos enviados no son validos
                  detalles:
                    - campo: nombre
                      mensaje: El nombre es obligatorio
                    - campo: email
                      mensaje: El correo no tiene un formato valido
                    - campo: contrasena
                      mensaje: La contrasena debe tener al menos 8 caracteres
            jsonInvalido:
              $ref: '#/components/examples/JsonInvalido'

    ErrorInterno:
      description: Error inesperado del servidor. Nunca expone el detalle interno.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: ERROR_INTERNO
              mensaje: Ocurrio un error inesperado. Volve a intentar en un momento.
              detalles: []

    RutaNoEncontrada:
      description: |
        La ruta pedida no existe bajo `/api`. La devuelve el terminador del
        router de la API, antes de los archivos estaticos del frontend.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: RUTA_NO_ENCONTRADA
              mensaje: No existe la ruta POST /api/auth/loquesea
              detalles: []

    SinSesion:
      description: Sin sesion valida (falta, vencida o revocada).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: SESION_INVALIDA
              mensaje: "La sesion no es valida o expiro. Inicia sesion de nuevo."
              detalles: []

    CuentaBloqueada:
      description: Cuenta bloqueada o eliminada. Solo se responde a quien ya probo la contraseña.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: CUENTA_BLOQUEADA
              mensaje: "Tu cuenta no esta habilitada. Si crees que es un error, contacta a un administrador."
              detalles: []

    AccesoDenegado:
      description: Sesion valida sin el rol requerido (administrador).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: ACCESO_DENEGADO
              mensaje: "No tenes permiso para realizar esta accion"
              detalles: []

    NoEncontrado:
      description: No existe, o es un recurso privado ajeno.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: NO_ENCONTRADO
              mensaje: "No encontramos ese libro en tu catalogo"
              detalles: []

    EstadoInvalido:
      description: La operacion no es legal en el estado actual del recurso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: ESTADO_INVALIDO
              mensaje: "Tenes 2 ejemplares reservados en intercambios aceptados. No podes bajar de 2."
              detalles: []

    ContrasenaIncorrecta:
      description: La contraseña de reautenticacion no coincide.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: CONTRASENA_INCORRECTA
              mensaje: "La contrasena no es correcta"
              detalles: []

    CuentaActualizada:
      description: Cuenta con su estado nuevo.
      content:
        application/json:
          schema:
            type: object
            required: [cuenta]
            properties:
              cuenta:
                $ref: '#/components/schemas/CuentaAdmin'

    PublicacionDevuelta:
      description: La publicacion, con sus datos al dia.
      content:
        application/json:
          schema:
            type: object
            required: [publicacion]
            properties:
              publicacion:
                $ref: '#/components/schemas/Publicacion'

    SolicitudDevuelta:
      description: |
        La solicitud como queda, con `puedo` al dia para que la interfaz
        redibuje los botones.
      content:
        application/json:
          schema:
            type: object
            required: [solicitud]
            properties:
              solicitud:
                $ref: '#/components/schemas/Solicitud'

    ArchivoDemasiadoGrande:
      description: El cuerpo supera el tamaño permitido (la foto pasa de 2 MB).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: ARCHIVO_DEMASIADO_GRANDE
              mensaje: La foto supera el máximo de 2 MB
              detalles: []
